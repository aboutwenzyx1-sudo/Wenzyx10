name: Web to APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "URL website yang mau dijadiin APK"
        required: true
        type: string
      app_name:
        description: "Nama aplikasi"
        required: true
        default: "MyWebApp"
        type: string
      chat_id:
        description: "Telegram chat_id penerima APK"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create WebView Flutter project
        run: |
          flutter create --org com.wenzyx --project-name webview_app --platforms android webview_app
          cd webview_app
          flutter pub add webview_flutter

      - name: Inject WebView code
        run: |
          cat > webview_app/lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return const MaterialApp(
                debugShowCheckedModeBanner: false,
                home: WebViewScreen(),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});
            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController _controller;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('${{ github.event.inputs.website_url }}'));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(child: WebViewWidget(controller: _controller)),
              );
            }
          }
          EOF

      - name: Set app name
        run: |
          cd webview_app
          sed -i "s/android:label=\"webview_app\"/android:label=\"${{ github.event.inputs.app_name }}\"/g" android/app/src/main/AndroidManifest.xml || true

      - name: Flutter pub get
        working-directory: ./webview_app
        run: flutter pub get

      - name: Build APK Release
        working-directory: ./webview_app
        run: flutter build apk --release

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find webview_app/build/app/outputs/flutter-apk -name "app-release.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_SIZE_MB=$(echo "scale=2; $APK_SIZE/1024/1024" | bc)
          APK_NAME=$(basename "$APK_PATH")
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_size_mb=$APK_SIZE_MB" >> $GITHUB_OUTPUT
          echo "✅ APK: $APK_NAME ($APK_SIZE_MB MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-web-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7

      - name: Send APK to Telegram
        if: success()
        run: |
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          APK_NAME="${{ steps.find_apk.outputs.apk_name }}"
          APK_SIZE_MB="${{ steps.find_apk.outputs.apk_size_mb }}"
          APP_NAME="${{ github.event.inputs.app_name }}"
          URL="${{ github.event.inputs.website_url }}"

          CAPTION="✅ <b>APK WEB REALES — SUKSES</b>%0A%0A🌐 <b>URL:</b> ${URL}%0A📛 <b>Nama:</b> ${APP_NAME}%0A📱 <b>File:</b> ${APK_NAME}%0A📊 <b>Size:</b> ${APK_SIZE_MB} MB%0A⚙️ <b>Mode:</b> WEB TO APK%0A🕐 <b>Build:</b> $(date +'%d/%m/%Y %H:%M') WIB%0A%0A🚀 <b>WENZYX AI V8 — PASUKAN TEKNOLOGI</b>"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=HTML"

      - name: Notify failure
        if: failure()
        run: |
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=❌ Build APK WEB GAGAL.%0ACek log di GitHub Actions." \
            -d "parse_mode=HTML"
